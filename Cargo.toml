[package]
name = "scatter_matrix_operator"
version = "0.1.0"
edition = "2024"
description = "Scatter-matrix rows for Tercen: every marker pair per cell, one panel per population, ready for a Plot step"
license = "Apache-2.0"

[lib]
name = "scatter_matrix_operator"
path = "src/lib.rs"

[[bin]]
name = "scatter_matrix_operator"
path = "src/main.rs"

[[bin]]
name = "dev"
path = "src/bin/dev.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
tercen-rs = { git = "https://github.com/tercen/tercen-rs", branch = "main" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time"] }
tonic = "0.14"
futures = "0.3"
rustson = { git = "https://github.com/tercen/rustson", branch = "master" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tikv-jemallocator = "0.6"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
